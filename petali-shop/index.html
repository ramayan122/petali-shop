async function saveProduct(quiet) {
  const f = pf, n = v => v === '' || v == null ? null : Number(v);
  if (!f.name.trim()) { toast('اكتبي اسم المنتج'); return false; }
  const row = { name: f.name.trim(), description: f.description || null, price: n(f.price) || 0, wholesale_price: n(f.wholesale_price), wholesale_min_qty: n(f.wholesale_min_qty), track_stock: !!f.track_stock, est_hours: n(f.est_min) ? Math.round(n(f.est_min) / 60 * 100) / 100 : 0, is_available: f.is_available, is_paused: f.is_paused, image_path: (f.images && f.images[0]) || f.image_path || null, images: f.images || [], options: pfOptions() };
  if ('category_id' in f) row.category_id = f.category_id || null;
  let id = f.id;
  if (id) { const { error } = await sb.from('products').update(row).eq('id', id); if (error) { toast(error.message); return false; } }
  else { const { data, error } = await sb.from('products').insert(row).select('id').single(); if (error) { toast(error.message); return false; } id = f.id = data.id; }
  await sb.from('product_private').upsert({ product_id: id, extra_costs: n(f.extra_costs) || 0, internal_notes: f.internal_notes || null }, { onConflict: 'product_id' });
  await sb.from('product_materials').delete().eq('product_id', id);
  const ms = f.mats.filter(m => m.item_id && Number(m.qty) > 0);
  if (ms.length) { const { error } = await sb.from('product_materials').insert(ms.map(m => ({ product_id: id, item_id: m.item_id, qty_per_piece: Number(m.qty) }))); if (error) { toast('المواد: ' + (error.message.includes('duplicate') ? 'مادة مكررة' : error.message)); return false; } }
  if (!quiet) { toast('تم الحفظ'); go('products'); }
  return true;
}

async function newOrder() {

  prodCache = p.data || []; locCache = l.data || [];
  if (!prodCache.length) return toast('أضيفي منتجًا أولًا');
  no = { name: '', phone: '', loc: locCache[0]?.id, executor: '', due: '', discount: '', notes: '', items: [newItem()] }; go('neworder');
}
function pickProd(i, pid) { const it = no.items[i]; it.pid = pid; it.opts = defOpts(prodCache.find(x => x.id === pid)); render(); }
function setOpt(i, gi, v) { const it = no.items[i]; it.opts[prodCache.find(x => x.id === it.pid).options[gi].name] = v; }
async function saveOrder() {
  const f = no; if (!f.name.trim() || !f.phone.trim()) return toast('اكتبي اسم العميل ورقمه'); if (!f.items.length) return toast('أضيفي منتجًا واحدًا على الأقل');
  const loc = locCache.find(l => l.id === f.loc);
  const { data: o, error } = await sb.from('orders').insert({ customer_name: f.name.trim(), customer_phone: f.phone.trim(), pickup_location_id: loc?.id || null, pickup_location_name: loc?.name || null, executor: f.executor || null, due_date: f.due || null, customer_notes: f.notes || null, source: 'manual' }).select('id').single();
  if (error) return toast(error.message);
  const rows = f.items.map(it => { const p = prodCache.find(x => x.id === it.pid), q = Math.max(1, it.qty | 0); let pc = p.price; if (p.wholesale_price && p.wholesale_min_qty && q >= p.wholesale_min_qty) pc = p.wholesale_price; if (it.gift) pc = 0;
    return { order_id: o.id, product_id: p.id, product_name: p.name, image_path: p.image_path, options: it.opts, quantity: q, unit_price: pc, line_total: pc * q, is_gift: !!it.gift }; });
  const r = await sb.from('order_items').insert(rows); if (r.error) return toast(r.error.message);
  if (Number(f.discount) > 0) await sb.from('orders').update({ order_discount: Number(f.discount) }).eq('id', o.id);
  await sb.rpc('recalc_order_totals', { p_order: o.id }); toast('تم إنشاء الطلب'); go('order', o.id);
}
async function addEntry() {
  const t = $('#fe_t').value, a = $('#fe_a').value, m = parseFloat($('#fe_m').value), note = $('#fe_n').value.trim() || null;
  if (isNaN(m) || (m === 0)) return toast('اكتبي المبلغ'); if (t !== 'adjustment' && m < 0) return toast('اكتبي المبلغ بدون سالب');
  let rows;
  if (t === 'income') rows = [{ type: t, account: 'general', amount: m }];
  else if (t === 'expense' || t === 'withdrawal') rows = [{ type: t, account: a, amount: -m }];
  else if (t === 'savings_transfer') { if (a === 'savings') return toast('اختاري راما أو مريم'); rows = [{ type: t, account: a, amount: -m }, { type: t, account: 'savings', amount: m }]; }
  else rows = [{ type: t, account: a, amount: m }];
  const { error } = await sb.from('finance_entries').insert(rows.map(r => ({ ...r, note, created_by: me.id }))); if (error) return toast(error.message); toast('تم التسجيل'); render();
}

async function fetchAll(t) { let out = [], i = 0; for (;;) { const { data, error } = await sb.from(t).select('*').range(i, i + 999); if (error) throw error; out = out.concat(data); if (data.length < 1000) break; i += 1000; } return out; }
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
const csv = rows => { const k = Object.keys(rows[0]), c = v => `"${String(v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : v).replace(/"/g, '""')}"`; return '\ufeff' + [k.join(','), ...rows.map(r => k.map(x => c(r[x])).join(','))].join('\n'); };

async function exportCsv(t) { try { const r = await fetchAll(t); if (!r.length) return toast('لا توجد بيانات'); download(`petali-${t}-${today()}.csv`, csv(r), 'text/csv;charset=utf-8'); } catch (e) { toast(e.message); } }
async function exportAll() {

  const { data: r } = await sb.from('orders').select('status,executor,due_date,deposit_required').eq('id', id).single(), nx = NEXT[r.status]; if (!nx) return;

    onSubmit: async () => { const { error } = await sb.from('orders').update({ status: 'final_confirmed' }).eq('id', id); if (error) return error.message; } });

  setStatus(id, nx[0]);

async function progSet(id, val, cur, mine, q) {

}
