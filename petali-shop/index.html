.ib.on{border-color:var(--mv);color:var(--mv)}

.trk.on{background:var(--mv);color:var(--onmv,#fff)}

.rate{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;color:var(--tx2)}.rate .lucide{width:15px;height:15px;color:#D9A441;fill:#D9A441}

  return { lines, gifts, sub, fx, total: sub - fx };

  const bt = $('#bb_total'); if (bt) bt.textContent = money(tot);

  const o = AO[rd.i], c = $('#rv_c').value.trim() || null;
  const { error } = rd.kind === 'store' ? await sb.rpc('submit_store_review', { p_token: tok(), p_order_no: o.order_no, p_rating: rate, p_comment: c })
    : await sb.rpc('submit_product_review', { p_token: tok(), p_order_no: o.order_no, p_product: o.products[rd.j].product_id, p_rating: rate, p_comment: c });
  if (error) return $('#rv_e').textContent = aerr(error);
  closeModal(); toast('شكرًا لتقييمك'); PRC = {}; loadAcc();
}
async function loadPR(id) {
  let d = PRC[id]; if (!d) { const r = await sb.rpc('get_product_reviews', { p_product: id, p_limit: 20 }); d = r.error ? null : r.data; if (d) PRC[id] = d; }
  const el = $('#prv'), sm = $('#prs'); if (!el || curP !== id) return;
  if (d && d.count) { if (sm) sm.innerHTML = `<div class="rate">${ic('star')} ${d.avg} <span>(${d.count} تقييم)</span></div>`; el.innerHTML = `<div class="grid">${d.items.map(r => `<div class="card"><div class="rs">${stars(r.rating)}</div><p>${esc(r.comment || '')}</p><div class="sub">— ${esc(r.first_name)}</div></div>`).join('')}</div>`; }
  else el.innerHTML = '<div class="card center sub">لا توجد تقييمات لهذا المنتج بعد. يمكن لمن استلم طلبه تقييمه من حسابه.</div>';
}

/* ---------- التشغيل ---------- */
function route(keep) {
  const h = (location.hash || '#home').slice(1); let v, a; if (h.startsWith('p-')) { v = 'product'; a = h.slice(2); if (a !== curP) { curP = a; psel = {}; pq = 1; } } else v = R[h] ? h : 'home';
  $('#view').innerHTML = R[v](a); document.querySelectorAll('#nav a,.hact a').forEach(x => x.classList.toggle('on', x.dataset.v === (v === 'product' ? 'products' : v))); if (!keep) scrollTo(0, 0); closeModal(); document.querySelectorAll('[id^=lv_]').forEach(e => lv(e.id.slice(3))); icons(); cartBar();
  if (v === 'invoice' && fresh) { fresh = false; modal(); }
  if (v === 'checkout') { if (!L.some(l => l.id === selLoc)) selLoc = L[0]?.id || ''; const e = $('#locs'); if (e) e.innerHTML = locCards(); if (me) { $('#f_n').value = me.name; $('#f_p').value = me.phone; } }
  if (v === 'product') loadPR(a);
  if (v === 'account' && me) loadAcc();
}
addEventListener('hashchange', () => route());
(async () => {
  $('#cartic').innerHTML = ic('shopping-bag'); $('#trkic').innerHTML = ic('package'); $('#accic').innerHTML = ic('user'); saveCart(); $('#view').innerHTML = '<div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
  const [p, o, l, s, rv, cat, cfg, rt, cn] = await Promise.all([sb.from('products').select('*').is('deleted_at', null).order('sort_order').order('created_at'), sb.from('offers').select('*').is('deleted_at', null), sb.from('pickup_locations').select('*').is('deleted_at', null).order('sort_order'), sb.rpc('get_public_settings'), sb.rpc('get_public_reviews', { p_limit: 12 }), sb.from('product_categories').select('*').order('sort_order'), sb.rpc('get_shop_config'), sb.rpc('get_rating_summary'), (async () => { try { if (!sessionStorage.getItem('petali_pv')) { sessionStorage.setItem('petali_pv', '1'); await sb.rpc('register_visit'); } } catch (e) {} return sb.rpc('get_shop_counters'); })()]);
  P = p.data || []; O = o.data || []; L = l.data || []; if (s.data) S = s.data; RV = rv.data || []; C = (cat && cat.data) || []; C = C.filter(c => P.some(x => x.category_id === c.id));
  RT = rt.data || {}; const cf = cfg.data || {}; if (cf.theme) applyTheme(cf.theme); if (!S.home_category && cf.home_category) S.home_category = cf.home_category;
  if (S.home_category) C.sort((a, b) => (b.id === S.home_category) - (a.id === S.home_category));
  drawCounters(cn && cn.data); await loadMe();
  cart = cart.filter(c => P.some(x => x.id === c.pid)); saveCart(); route();
})();
</script>
